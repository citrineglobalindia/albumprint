<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Innovative Photo Designers — Album Operations CRM</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ff7a10" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="/logo.png" />
    <style>
      /* Brand loader: shared by the first paint (below, before the app script runs) and the in-app <BrandLoader />. */
      .ipd-loader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: radial-gradient(1200px 600px at 50% 40%, #ffffff 0%, #f4f5ff 60%, #eceefd 100%); font: 600 13px "Plus Jakarta Sans", system-ui, sans-serif; color: #5b6490; animation: ipd-in .35s ease-out .12s both; }
      .ipd-stack { display: flex; flex-direction: column; align-items: center; gap: 22px; }
      .ipd-mark { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
      .ipd-glow { position: absolute; inset: -18px; border-radius: 50%; background: radial-gradient(circle, rgba(255,122,16,.28) 0%, rgba(255,122,16,0) 68%); animation: ipd-glow 2.4s ease-in-out infinite; }
      .ipd-ring { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, rgba(255,122,16,0) 0deg, rgba(255,122,16,.15) 90deg, #ff7a10 300deg, #ffb46b 350deg, rgba(255,122,16,0) 360deg); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); animation: ipd-spin 1.1s linear infinite; }
      .ipd-track { position: absolute; inset: 0; border-radius: 50%; border: 5px solid rgba(15,27,76,.06); }
      .ipd-dot { position: absolute; inset: 0; animation: ipd-spin 1.1s linear infinite; }
      .ipd-dot::after { content: ""; position: absolute; top: -1px; left: 50%; width: 9px; height: 9px; margin-left: -4.5px; border-radius: 50%; background: #ff7a10; box-shadow: 0 0 12px 3px rgba(255,122,16,.55); transform: rotate(0deg) translateX(0); }
      .ipd-aperture { width: 96px; height: 96px; animation: ipd-shutter 2.4s cubic-bezier(.65,0,.35,1) infinite; filter: drop-shadow(0 8px 18px rgba(15,27,76,.25)); }
      .ipd-word { height: 46px; width: auto; opacity: 0; animation: ipd-rise .6s ease-out .35s forwards; }
      .ipd-bar { position: relative; width: 180px; height: 4px; overflow: hidden; border-radius: 9px; background: rgba(15,27,76,.08); }
      .ipd-bar::before { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 9px; background: linear-gradient(90deg, #ff7a10, #ffb46b); animation: ipd-slide 1.3s cubic-bezier(.65,0,.35,1) infinite; }
      .ipd-text::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: ipd-dots 1.2s steps(4) infinite; }
      .ipd-loader.ipd-now { animation: none } .ipd-now .ipd-word { opacity: 1; animation: none }
      @keyframes ipd-in { from { opacity: 0 } to { opacity: 1 } }
      @keyframes ipd-spin { to { transform: rotate(360deg) } }
      @keyframes ipd-shutter { 0% { transform: rotate(0) scale(1) } 45% { transform: rotate(200deg) scale(.86) } 60% { transform: rotate(230deg) scale(.9) } 100% { transform: rotate(360deg) scale(1) } }
      @keyframes ipd-glow { 0%, 100% { transform: scale(.92); opacity: .7 } 50% { transform: scale(1.08); opacity: 1 } }
      @keyframes ipd-rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      @keyframes ipd-slide { 0% { transform: translateX(-110%) } 100% { transform: translateX(260%) } }
      @keyframes ipd-dots { 0% { content: "" } 25% { content: "." } 50% { content: ".." } 75% { content: "..." } }
      @media (prefers-reduced-motion: reduce) { .ipd-ring, .ipd-dot, .ipd-aperture, .ipd-glow, .ipd-bar::before, .ipd-text::after { animation: none } .ipd-word { opacity: 1; animation: none } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ipd-loader" role="status" aria-label="Loading Innovative Photo Designers">
        <div class="ipd-stack">
          <div class="ipd-mark"><div class="ipd-glow"></div><div class="ipd-track"></div><div class="ipd-ring"></div><div class="ipd-dot"></div><img class="ipd-aperture" src="/logo.png" alt="" /></div>
          <img class="ipd-word" src="/logo-full-dark-text.png" alt="Innovative Photo Designers" />
          <div class="ipd-bar"></div>
          <div class="ipd-text">Loading your workspace</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
